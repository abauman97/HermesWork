name: Build Plugin Assets
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Publish only trusted main pushes or manual runs selecting main.
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    # Every run must reach the publisher, even out of order. A concurrency
    # group's pending replacement could drop the newest revision. The script uses
    # an atomic expected-SHA lease to coordinate concurrent publishers instead.
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "26"
      - name: Build and publish plugin assets
        env:
          SOURCE_SHA: ${{ github.sha }}
        shell: bash
        run: |
          # Keep the running script stable across checkout resets.
          cp scripts/publish-assets.sh "$RUNNER_TEMP/publish-assets.sh"
          bash "$RUNNER_TEMP/publish-assets.sh"
