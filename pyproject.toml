[project]
name = "hermes-projects"
version = "0.1.0"
description = "Native Hermes project management and create-first native chat"
requires-python = ">=3.11"
dependencies = ["fastapi>=0.115", "pydantic>=2"]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.28", "ruff>=0.14", "ty>=0.0.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["hermes_projects"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests/backend"]
